<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вхід — Form Sender</title>
  <style>
    :root { --bg:#08111f; --panel:#101d31; --field:#172942; --line:#2a4162; --text:#eff6ff; --muted:#9bb0ca; --accent:#48a7ff; --bad:#ff7b86; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:linear-gradient(135deg,#07101c,#0d1c31); color:var(--text); font:14px system-ui,-apple-system,sans-serif; }
    .card { width:min(390px,calc(100% - 28px)); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px; }
    h1 { font-size:22px; margin:0 0 6px; }
    p { color:var(--muted); margin:0 0 22px; }
    label { display:block; color:var(--muted); font-size:12px; margin-bottom:7px; }
    input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px; background:var(--field); color:var(--text); font:inherit; }
    input:focus { outline:2px solid rgba(72,167,255,.3); border-color:var(--accent); }
    button { width:100%; margin-top:16px; padding:11px; border:0; border-radius:8px; background:linear-gradient(135deg,#238ce0,#5d6cff); color:#fff; font-weight:700; cursor:pointer; }
    .error { color:var(--bad); background:rgba(255,123,134,.1); border:1px solid rgba(255,123,134,.25); border-radius:8px; padding:9px 11px; margin-bottom:16px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🛡 Form Sender</h1>
    <p>Увійдіть, щоб відкрити інструмент масової відправки.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <label for="password">Пароль оператора</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Увійти</button>
    </form>
  </main>
</body>
</html>
